<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>解球</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#F4F3EF,#14161B);--card:light-dark(#fff,#1E2128);--ink:light-dark(#1D2026,#EDEBE5);--muted:light-dark(#73787F,#9AA0A8);--line:light-dark(#E7E4DC,#2B303A);--v:light-dark(#0B6B4F,#3FAE8D);--vsoft:light-dark(#E9F3EE,#1D352D);--danger:light-dark(#BE3A2B,#E06A57);--dsoft:light-dark(#F9EAE6,#3A2420);--amber:light-dark(#8A5A14,#D9A441);--asoft:light-dark(#F7EFDD,#332B1B);--pink:light-dark(#D9578A,#E88BB4)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:light-dark(#DDDAD2,#0B0D11);font-family:"PingFang SC","MiSans",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center}
.num{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums}
#phone{width:100%;max-width:430px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:480px){#phone{height:min(880px,96dvh);margin:auto;border-radius:34px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.35)}}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 20px;flex:0 0 auto;position:relative;z-index:6;background:var(--bg)}
.top .logo{font-size:16px;font-weight:700;letter-spacing:.1em}
.hzrow{display:flex;justify-content:space-between;padding:10px 2px 0}
.hz{display:flex;flex-direction:column;gap:3px;font-size:10.5px;line-height:1.35}
.hz.l{align-items:flex-start}.hz.r{align-items:flex-end;text-align:right}
.hz .l1{display:inline-flex;align-items:center;gap:5px;color:var(--v);font-weight:600;cursor:pointer}
.hz .l2{color:var(--muted)}.hz .l2 b{color:var(--ink);font-weight:600}
.hz .cnt{font-family:ui-monospace,monospace}
.dot{width:7px;height:7px;border-radius:50%;background:var(--v);display:inline-block;animation:pl 1.8s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
.avat{width:28px;height:28px;border-radius:50%;background:var(--vsoft);color:var(--v);display:grid;place-items:center;font-size:12px}
.msr{background-image:url(mascot-gen.png);background-size:300% 118%;background-position:var(--sx,50%) 32%;background-repeat:no-repeat;border-radius:24%;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.msr.avr{border-radius:50%;border:3px solid light-dark(rgba(255,255,255,.95),rgba(255,255,255,.22));box-shadow:0 4px 14px rgba(0,0,0,.25)}
.msr.bust{background-size:300% 152%;background-position:var(--sx,50%) 20%;aspect-ratio:1}
.mfl{animation:mfl 3.4s ease-in-out infinite}
@keyframes mfl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mh{position:relative}
.mh::after{content:"";position:absolute;inset:-7px;border-radius:50%;background:radial-gradient(circle,rgba(63,174,141,.30),transparent 70%);z-index:-1;animation:hl 3.4s ease-in-out infinite}
@keyframes hl{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 20px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
#chatbar{flex:0 0 auto;display:none;gap:8px;align-items:center;padding:10px 14px 14px;border-top:1px solid var(--line);background:var(--bg);box-shadow:0 -6px 14px light-dark(rgba(0,0,0,.07),rgba(0,0,0,.35))}
#chatbar.show{display:flex}
#chatbar .ib{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-size:13px;color:var(--muted);background:var(--card);border:0;outline:0;font-family:inherit}
#chatbar .rd{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:17px;cursor:pointer;flex:0 0 auto}
#tabs{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:10.5px;cursor:pointer}
.tab.on{color:var(--v);font-weight:600}
.tab .ti{font-size:19px;line-height:1}
.ttl{font-size:16.5px;font-weight:700;cursor:default}
.time{font-size:11px;color:var(--muted);padding:8px 3px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}
.eyebrow{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;margin-bottom:9px}
.eyebrow.amber{color:var(--amber)}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.match{font-size:19px;font-weight:600}
.match em{font-style:normal;font-size:13px;color:var(--muted);margin:0 6px;font-weight:400}
.call{font-size:23px;font-weight:700;margin:9px 0 2px}
.hc{font-size:11px;vertical-align:middle;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:8px;color:var(--muted);font-weight:400}
.costline{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;padding:8px 11px;background:var(--vsoft);border-radius:10px;font-size:12.5px}
.costline b{color:var(--v)}
.judge{margin-top:9px;border:1px solid var(--line);border-left:3px solid var(--v);border-radius:4px 12px 12px 4px;padding:8px 11px;font-size:12.5px;line-height:1.6}
.gates{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.gatechip{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.gatechip i{font-style:normal;color:var(--v);margin-right:3px}
.btnrow{display:flex;gap:8px;margin-top:13px}
.btn{flex:1;height:38px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--v);border-color:var(--v);color:light-dark(#fff,#0D1512);font-weight:600}
.btn.mini{flex:0 0 auto;height:30px;padding:0 12px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.seal{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:11px;color:var(--muted);cursor:pointer}
.hash{display:grid;grid-template-columns:repeat(4,auto);gap:2.5px}
.hash i{width:7px;height:7px;border-radius:2px;background:var(--line)}.hash i.l{background:var(--v)}
.stamp{width:30px;height:30px;border:1.5px solid var(--v);border-radius:9px;color:var(--v);display:grid;place-items:center;font-size:12px;font-weight:600;transform:rotate(-8deg);flex:0 0 auto}
.stamp.red{border-color:var(--danger);color:var(--danger)}
.arow{display:flex;gap:9px;padding:8px 1px;border-top:1px dashed var(--line);font-size:13px;line-height:1.5;cursor:pointer}
.arow:first-of-type{border-top:0}
.adot{width:7px;height:7px;border-radius:50%;background:var(--danger);margin-top:6px;flex:0 0 auto}
.arow span{color:var(--muted);font-weight:400}
.strip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:11px;background:var(--asoft);color:var(--amber);font-size:12px;margin-top:10px;cursor:pointer}
.strip b{font-weight:600}
.hero{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:15px;background:linear-gradient(135deg,var(--v),light-dark(#0A5A43,#2E8A6F));color:light-dark(#fff,#EAF6F1);margin-top:10px;cursor:pointer}
.hero .tt{flex:1;font-size:14px;font-weight:600}
.hero .s2{display:block;font-size:11px;opacity:.8;font-weight:400;margin-top:1px}
.hero .go{font-size:12px;opacity:.9}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 1px}
.kv span{color:var(--muted)}
.kv b{font-family:ui-monospace,monospace;font-weight:500;text-align:right}
.kv b.g{color:var(--v)}.kv b.r{color:var(--danger)}.kv b.a{color:var(--amber)}
.bar{height:6px;border-radius:999px;background:var(--line);margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--v)}
.opp{margin-top:9px;font-size:12.5px;line-height:1.6;color:var(--amber);background:var(--asoft);border-radius:9px;padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{font:inherit;font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--v);border-color:var(--v);color:light-dark(#fff,#0D1512);font-weight:600}
#backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
#backdrop.show{display:block;animation:fd .2s}
#sheet{position:absolute;left:0;right:0;bottom:76px;z-index:41;background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px 16px;transform:translateY(105%);transition:transform .28s cubic-bezier(.32,.72,.3,1),visibility .28s;max-height:75%;overflow-y:auto;visibility:hidden;pointer-events:none}
#sheet.show{transform:translateY(0);visibility:visible;pointer-events:auto}
.handle{width:36px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 10px}
@keyframes fd{from{opacity:0}to{opacity:1}}
#toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:60;white-space:nowrap;max-width:90%;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger);color:#fff}
.usermsg{max-width:80%;background:var(--vsoft);border-radius:14px 14px 3px 14px;padding:8px 12px;font-size:13px;margin:10px 0 0 auto;width:fit-content}
.aidmsg{width:94%;background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:12.5px;margin-top:8px}
.aidmsg .h{font-weight:600;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
.rt{font-size:10.5px;border-radius:999px;padding:1px 8px;background:var(--vsoft);color:var(--v);font-weight:400;flex:0 0 auto}
.rt.out{background:var(--asoft);color:var(--amber)}
.aidmsg .r{color:var(--muted);line-height:1.6;margin-top:3px}
.aidmsg .r b{color:var(--ink)}
.more{display:block;margin-top:5px;color:var(--v);font-size:11.5px;cursor:pointer}
.foot{text-align:center;font-size:11px;color:var(--muted);padding:12px 6px 0;line-height:1.7}
.legal{margin-top:12px;padding:9px 11px;border-radius:10px;background:var(--asoft);color:var(--amber);font-size:11px;line-height:1.7;text-align:center}
.grp{font-size:11px;color:var(--muted);padding:12px 3px 4px}
.set{display:flex;justify-content:space-between;align-items:center;padding:11px 3px;border-top:1px dashed var(--line);font-size:14px;cursor:pointer}
.set:first-of-type{border-top:0}
.set .v{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px}
.divider{margin:10px 0;border-top:1px dashed var(--line)}
.prow{display:grid;grid-template-columns:58px 1fr 46px;gap:8px;align-items:center;font-size:12px;padding:3.5px 0}
.prow>span{color:var(--muted)}
.pbar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--v);border-radius:999px}
.prow b{font-family:ui-monospace,monospace;font-weight:500;text-align:right}
.diag{margin-top:10px;background:var(--dsoft);border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.65}
.diag b{color:var(--danger)}
.diag.g{background:var(--vsoft)}.diag.g b{color:var(--v)}
.warn{margin-top:10px;background:var(--asoft);border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.7}
.warn b{color:var(--amber)}
.fnd{border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-top:10px}
.fnd .fh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fnd .no{font-family:ui-monospace,monospace;font-size:11px;color:var(--v);letter-spacing:.15em}
.fnd .sev{font-size:11px;border-radius:999px;padding:1.5px 9px}
.fnd .sev.hi{background:var(--dsoft);color:var(--danger)}
.fnd .sev.mid{background:var(--asoft);color:var(--amber)}
.fnd .ft{font-size:13.5px;font-weight:600;margin-top:7px;line-height:1.5}
.fnd .fd{margin-top:9px;background:var(--bg);border-radius:9px;padding:8px 10px;font-family:ui-monospace,monospace;font-size:11px;line-height:1.9}
.fnd .pl{margin-top:9px;padding-left:10px;border-left:2px solid var(--v);font-size:12.5px;line-height:1.7}
.fnd .pl b{font-weight:600}
.fnd .my{margin-top:9px;background:var(--vsoft);border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.6}
.fnd .my b{color:var(--v)}
.fnd .eg{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.6}
.gauge{position:relative;width:112px;height:112px;margin:12px auto 0}
.gauge svg{width:100%;height:100%}
.gauge .gn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .gn b{font-size:32px;font-family:ui-monospace,monospace;font-weight:700;line-height:1}
.gauge .gn span{font-size:10.5px;color:var(--muted);margin-top:4px}
.ssc{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.ssc .c{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.ssc .c b{display:block;font-size:15px;font-family:ui-monospace,monospace}
.ssc .c span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.ssc .c.bad b{color:var(--danger)}
.picked{border-left:3px solid var(--v)}
.picked .eyebrow{color:var(--v)}
.picked .eyebrow.amber{color:var(--amber)}
.sale{display:grid;grid-template-columns:auto 1fr auto;gap:2px 9px;padding:7.5px 1px;border-top:1px dashed var(--line);font-size:12.5px;align-items:center;cursor:pointer}
.sale:first-of-type{border-top:0}
.sale .sn{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);grid-row:span 2;align-self:center}
.sale .tm{grid-column:2;font-size:11px;color:var(--muted)}
.sale .st{grid-column:3;grid-row:span 2;font-size:11px;border-radius:999px;padding:2px 8px;text-align:center}
.sale .st.ok{background:var(--vsoft);color:var(--v)}
.sale .st.bad{background:var(--dsoft);color:var(--danger)}
.sale .st.na{background:transparent;border:1px solid var(--line);color:var(--muted)}
.sysp{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12.5px;margin-bottom:10px;animation:fd .3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.tile{border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.tile .ti{font-size:20px}
.tile .tt{font-size:13px;font-weight:600}
.tile .ts{font-size:11px;color:var(--muted)}
.leg{display:flex;align-items:center;gap:9px;padding:9px 2px;border-top:1px dashed var(--line);font-size:13px;cursor:pointer}
.leg:first-of-type{border-top:0}
.leg .ck{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:11px;color:transparent}
.leg.on .ck{background:var(--v);border-color:var(--v);color:#fff}
.leg .sp{margin-left:auto;font-family:ui-monospace,monospace;color:var(--muted);font-size:12px}
.leg.dead{opacity:.45}
.leg .deadtag{font-size:10px;color:var(--danger)}
.amt{display:flex;align-items:center;gap:10px;margin-top:12px}
.amt button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:transparent;font-size:18px;cursor:pointer;color:var(--ink)}
.amt input{flex:1;height:38px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--ink);text-align:center;font:inherit;font-size:16px;outline:0}
.tl{list-style:none}
.tl li{display:flex;gap:9px;font-size:12.5px;padding:5px 0;line-height:1.5}
.tl .t{color:var(--muted);font-family:ui-monospace,monospace;flex:0 0 42px}
.tl .goal{color:var(--v);font-weight:600}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.dash .d{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px}
.dash .d b{font-size:17px;font-family:ui-monospace,monospace;display:block}
.dash .d span{font-size:11px;color:var(--muted)}
.pcard{display:flex;gap:10px;align-items:center}
.pcell{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:11px 2px;border-top:1px dashed var(--line);cursor:pointer;font-size:13px}
.pcell:first-of-type{border-top:0}
.pcell .pv{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:22px}
.pcell .ck{color:var(--v);font-weight:600;opacity:0}
.pcell.on .ck{opacity:1}
.pcell.on{background:var(--vsoft);border-radius:11px;padding-left:8px;padding-right:8px}
.meter{display:flex;height:8px;border-radius:999px;overflow:hidden;margin:8px 0 2px}
.meter i{display:block;height:100%}
.gline{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:8px 2px;border-top:1px dashed var(--line);font-size:13px}
.gline:first-of-type{border-top:0}
.gline .gn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px}
.gline.ok .gn{background:var(--vsoft);color:var(--v)}
.gline.no .gn{background:var(--dsoft);color:var(--danger)}
.gline .res{font-weight:600;font-size:12px}
.gline.ok .res{color:var(--v)}
.gline.no .res{color:var(--danger)}
.dsec{padding:10px 2px;border-top:1px dashed var(--line)}
.dsec:first-of-type{border-top:0}
.dsec .tt{font-size:13.5px;font-weight:600}
.dsec .db{font-size:12.5px;line-height:1.75;color:var(--muted);margin-top:5px}
.dsec .db b{color:var(--ink)}

/* ===== 情报层 v2 · UX 优化（2026-11-03） ===== */
.sigline{display:flex;align-items:center;justify-content:space-between;gap:9px;width:100%;min-height:46px;margin-top:11px;padding:9px 11px;border-radius:12px;background:linear-gradient(90deg,var(--vsoft),transparent);border:1px solid rgba(63,174,141,.28);font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.sigline.hot{background:linear-gradient(90deg,var(--asoft),transparent);border-color:rgba(217,164,65,.38)}
.sigline .sl{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.sigline .sl .si{font-size:15px;flex:0 0 auto}
.sigline .sl b{font-size:12.5px;font-weight:600;white-space:nowrap}
.sigline .sl i{font-style:normal;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sigline .arrow{font-size:11.5px;color:var(--muted);flex:0 0 auto}
.tag{font-size:10px;border-radius:999px;padding:1.5px 7px;white-space:nowrap;flex:0 0 auto}
.tag.hot{background:var(--asoft);color:var(--amber)}
.tag.ver{background:var(--vsoft);color:var(--v)}
.tag.gray{border:1px solid var(--line);color:var(--muted)}
.gatechip.stale{border-color:rgba(217,164,65,.4);color:var(--amber)}
.gatechip.stale i{color:var(--amber)}
.gatechip.bad{border-color:rgba(224,106,87,.45);color:var(--danger)}
.gatechip.bad i{color:var(--danger)}
.waitbox{margin-top:11px;padding:10px 12px;border:1px dashed rgba(217,164,65,.45);border-radius:12px;background:var(--asoft)}
.waitbox .wb{display:flex;justify-content:space-between;align-items:center;gap:9px;font-size:12px;line-height:1.5}
.waitbox .wb+.wb{margin-top:7px}
.waitbox .count{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);white-space:nowrap}
.whywait{margin-top:8px;font-size:11.5px;color:var(--muted)}
.whywait summary{min-height:34px;display:flex;align-items:center;gap:4px;cursor:pointer;list-style:none}
.whywait summary::-webkit-details-marker{display:none}
.whywait summary::after{content:"›";transition:transform .2s}
.whywait[open] summary::after{transform:rotate(90deg)}
.whywait p{margin-top:4px;line-height:1.65}
.sigitem{border-top:1px dashed var(--line)}
.sigitem:first-of-type{border-top:0}
.sigitem summary{display:grid;grid-template-columns:26px 1fr auto 10px;gap:9px;align-items:center;min-height:50px;padding:8px 2px;cursor:pointer;list-style:none}
.sigitem summary::after{content:"›";color:var(--muted);font-size:14px;justify-self:end;transition:transform .2s}
.sigitem[open] summary::after{transform:rotate(90deg)}
.sigitem summary::-webkit-details-marker{display:none}
.sigitem .si{width:26px;height:26px;border-radius:8px;background:var(--bg);color:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:600}
.sigitem .sm{min-width:0}
.sigitem .sm b{display:block;font-size:12.5px;line-height:1.35}
.sigitem .sm span{display:block;font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.sigright{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sigright .pp{font-family:ui-monospace,monospace;font-size:12px;font-weight:600}
.pp.up{color:var(--v)}.pp.down{color:var(--danger)}.pp.flat{color:var(--muted)}
.sbody{padding:0 2px 11px 33px;font-size:11.5px;color:var(--muted);line-height:1.65}
.srow{display:grid;grid-template-columns:36px 1fr;gap:7px;margin-top:4px}
.srow>span:first-child{opacity:.75}
.secnote{margin-top:10px;padding:9px 11px;background:var(--asoft);border-radius:10px;font-size:11px;color:var(--amber);line-height:1.65}
.aihead{font-size:15px;font-weight:600;line-height:1.55;margin-top:2px}
.scen{margin-top:11px}
.scenrow{padding:7px 0;border-top:1px dashed var(--line)}
.scenrow:first-child{border-top:0;padding-top:0}
.scenh{display:flex;align-items:center;gap:7px;font-size:12px}
.scenh b{font-weight:600}
.scenh .num{margin-left:auto;font-size:12px;color:var(--ink)}
.scenrow .pbar{margin:6px 0 4px}
.scend{font-size:10.5px;color:var(--muted);line-height:1.5}
.aimore{margin-top:8px;border-top:1px dashed var(--line)}
.aimore summary{display:flex;align-items:center;gap:4px;min-height:38px;font-size:12px;color:var(--v);cursor:pointer;list-style:none}
.aimore summary::-webkit-details-marker{display:none}
.aimore summary::after{content:"›";transition:transform .2s}
.aimore[open] summary::after{transform:rotate(90deg)}
.aibody{padding:0 1px 6px}
.aibody .li{font-size:12px;line-height:1.65;padding:3px 0 3px 16px;position:relative}
.aibody .li::before{content:"·";position:absolute;left:4px;color:var(--muted)}
.aibody .li.risk{color:var(--danger)}
.aibody .grp{font-size:11px;color:var(--muted);padding:7px 0 2px}
.evt{border-left:3px solid var(--amber)}
.evt .et{font-size:13px;line-height:1.6;margin-top:2px}
.flow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px}
.flow .old{color:var(--muted);text-decoration:line-through;font-family:ui-monospace,monospace}
.flow .new{color:var(--v);font-family:ui-monospace,monospace;font-weight:600}
.flow .delta{font-size:11px;color:var(--amber);border:1px solid rgba(217,164,65,.4);border-radius:999px;padding:1px 7px}
.updline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px;padding:7px 10px;border-radius:9px;background:var(--asoft);font-size:11.5px;color:var(--amber);cursor:pointer}
:focus-visible{outline:2px solid var(--v);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ================= v3 · AI 助理视觉系统（2026-11-03） ================= */
:root{
  color-scheme:light dark;
  --bg:light-dark(#F5F4EF,#0A0E0B);--card:light-dark(#FFFFFF,#141A16);

  --line:light-dark(#E9E7E0,#252C27);--v:light-dark(#0E6B4F,#6FCBA9);
  --vsoft:light-dark(#EAF3EE,#16261F);--danger:light-dark(#A8443A,#E06A57);
  --dsoft:light-dark(#F7E9E6,#2E1E1A);--amber:light-dark(#A66A18,#D9A441);
  --asoft:light-dark(#F7EFE1,#2B2418);--pink:light-dark(#A8443A,#E06A57);
  --shadow:0 1px 2px rgba(16,32,24,.04),0 14px 36px rgba(16,32,24,.06);
  --shadow-sm:0 1px 2px rgba(16,32,24,.05);
  --ink-on-dark:#F3F6F2;--muted-on-dark:#A6B5AD;
}

/* ================= 事件委托 ================= */
document.addEventListener("click",function(e){
  const t=e.target.closest("[data-act]");
  if(t){
    const a=t.getAttribute("data-act");
    if(ACT[a]){e.preventDefault();ACT[a](t);return}
  }
  const tab=e.target.closest(".tab");
  if(tab){switchTab(tab.dataset.tab);return}
});
document.addEventListener("change",function(e){
  if(e.target&&e.target.id==="avatarFile"){
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(){
      const img=new Image();
      img.onload=function(){
        const c=document.createElement("canvas");c.width=160;c.height=160;
        const ctx=c.getContext("2d");const side=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,160,160);
        S.avatarData=c.toDataURL("image/jpeg",0.85);S.avatar="";
        try{save()}catch(err){toast("图片太大，换一张",1);return}
        render();toast("头像已更新");
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  }
});
document.addEventListener("input",function(e){
  if(e.target&&e.target.id==="saleSearch"){
    const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll("#view .sale").forEach(function(row){
      row.style.display=(!q||row.textContent.toLowerCase().indexOf(q)>-1)?"":"none";
    });

});
document.addEventListener("keydown",function(e){

  el.style.transform="translate3d(0,"+(-y)+"px,0)";
}
document.getElementById("view").addEventListener("scroll",syncAssistantScroll);
function startMetrics(){
  if(window.__metricTimer)return;
  let infer=12847,viewers=12547,fresh=12;
  window.__metricTimer=setInterval(function(){
    infer+=1+Math.floor(Math.random()*3);
    viewers+=Math.floor(Math.random()*37)-18;
    fresh=fresh>=29?8:fresh+2;
    const a=document.getElementById("mInfer");if(a)a.textContent=infer.toLocaleString("en-US");
    const b=document.getElementById("mSources");if(b)b.textContent="4";
    const c=document.getElementById("mFresh");if(c)c.textContent=fresh+"s";
    const d=document.getElementById("mViewers");if(d)d.textContent=viewers.toLocaleString("en-US");
  },2400);
}
startMetrics();
render();
</script>
</body>
</html>
