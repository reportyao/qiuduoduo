<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>球多多运营台 · 运营控制台</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b6b4f'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <div id="login" class="login-screen">
    <section class="login-story">
      <div class="login-wordmark">
        <div class="brand-mark">球</div>
        <span>球多多</span>
      </div>
      <div>
        <p class="login-kicker">运营台</p>
        <h1>赛前判断<br>从复核到发布</h1>
        <p class="login-lead">查看今天的数据供给、模型复核和发布状态，处理会阻塞内容的事项。</p>
        <ol class="login-flow">
          <li><span class="idx">01</span><div><b>数据供给</b><small>SP、国际盘与阵容</small></div></li>
          <li><span class="idx">02</span><div><b>判断复核</b><small>三闸与 AI Review</small></div></li>
          <li><span class="idx">03</span><div><b>发布与复盘</b><small>封存、过期与撤回</small></div></li>
        </ol>
      </div>
      <p class="login-foot">球多多运营台 · Decision Snapshot / AI Review / Publish</p>
    </section>
    <section class="login-panel">
      <div class="login-card">
        <div class="login-form-head">
          <h2>登录</h2>
          <p>使用运营账号继续</p>
        </div>
        <form id="login-form">
          <div class="field">
            <label for="username">账号</label>
            <input id="username" name="username" type="text" autocomplete="username" value="admin" required>
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn primary full">进入控制台</button>
          <div id="login-error" class="login-error"></div>
        </form>
      </div>
    </section>
  </div>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">球</div>
        <div>
          <strong>球多多</strong>
          <span>运营控制台</span>
        </div>
      </div>
      <nav class="nav" aria-label="运营台导航">
        <div class="nav-label">运营</div>
        <button class="nav-item active" data-view="overview"><span>总览</span></button>
        <button class="nav-item" data-view="recommendations"><span>推荐主链</span></button>
        <button class="nav-item" data-view="plans"><span>组合预览</span></button>
        <div class="nav-label">配置</div>
        <button class="nav-item" data-view="models"><span>模型池</span></button>
        <button class="nav-item" data-view="gateway"><span>模型用量</span></button>
        <button class="nav-item" data-view="personas"><span>人设文案</span></button>
        <div class="nav-label">系统</div>
        <button class="nav-item" data-view="data"><span>数据源</span></button>
        <button class="nav-item" data-view="ops"><span>运维</span></button>
        <button class="nav-item" data-view="users" data-admin-only><span>账号</span></button>
        <button class="nav-item" data-view="audit" data-admin-only><span>审计</span></button>
        <button class="nav-item" data-view="logs"><span>运行日志</span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="env-pill" id="env-pill">—</div>
        <button id="logout" class="btn ghost small">退出</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="topbar-kicker" id="page-kicker">今日运营</div>
          <h1 id="page-title">总览</h1>
        </div>
        <div class="topbar-actions">
          <div class="date-pill" id="current-date">—</div>
          <div class="date-pill" id="last-updated">未刷新</div>
          <button id="auto-refresh" class="btn secondary">自动刷新 · 开</button>
          <button id="refresh" class="btn secondary">刷新</button>
        </div>
      </header>

      <div id="toast" class="toast"></div>
      <div id="modal" class="modal-backdrop" hidden><div class="modal" id="modal-card"></div></div>

      <section id="view-overview" class="view active"></section>
      <section id="view-models" class="view"></section>
      <section id="view-gateway" class="view"></section>
      <section id="view-personas" class="view"></section>
      <section id="view-recommendations" class="view"></section>
      <section id="view-plans" class="view"></section>
      <section id="view-data" class="view"></section>
      <section id="view-ops" class="view"></section>
      <section id="view-users" class="view"></section>
      <section id="view-audit" class="view"></section>
      <section id="view-logs" class="view"></section>
    </main>
  </div>

  <script src="/admin/assets/admin.js"></script>
  <script src="/admin/assets/admin_extra.js"></script>
</body>
</html>
